version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: dev_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baseapi
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dev_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
